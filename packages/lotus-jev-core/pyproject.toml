[project]
name = "lotus-jev-core"
version = "0.1.1"
description = "Jev Ultrafast core with host-owned browser and inference adapters."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Source = "https://github.com/DunnyBunny1/jev-computer-use"
Upstream = "https://github.com/browser-use/jev-ultrafast"

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_ultrafast"]

[tool.hatch.build.targets.wheel.force-include]
"UPSTREAM.md" = "jev_ultrafast/UPSTREAM.md"
